<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeForge - Supervisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style_supervisor.css">
</head>
<body>
<div class="d-flex" id="wrapper">

    <aside id="sidebar-wrapper">
        <div class="sidebar-heading text-center fw-bold">
            <i class="fa-solid fa-clock"></i> TimeForge
            <div class="role-badge">Supervisor</div>
        </div>
        <div class="list-group list-group-flush my-2">
            <a href="#" class="list-group-item list-group-item-action active" data-target="sec-tickets">
                <i class="fa-solid fa-ticket me-2"></i> Tickets Recibidos
            </a>
            <a href="#" class="list-group-item list-group-item-action" data-target="sec-horarios">
                <i class="fa-solid fa-calendar-days me-2"></i> Constructor de Horarios
            </a>
            <a href="#" class="list-group-item list-group-item-action" data-target="sec-agregar">
                <i class="fa-solid fa-calendar-plus me-2"></i> Agregar Horario Fijo
            </a>
        </div>
    </aside>

    <main id="page-content-wrapper" class="w-100">
        <nav class="navbar px-4">
            <button class="btn btn-outline-secondary me-3" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            <h2 class="fs-5 m-0 fw-bold" id="vista-titulo">Tickets Recibidos</h2>
            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="text-end d-none d-md-block">
                    <div class="fw-semibold small" id="session-username">—</div>
                    <div class="text-muted small" id="session-role">—</div>
                </div>
                <div class="avatar-circle"><i class="fa-solid fa-user-tie"></i></div>
                <button class="btn btn-outline-danger btn-sm" id="btn-logout">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
                </button>
            </div>
        </nav>

        <div class="container-fluid p-4">

            <!-- ── TICKETS RECIBIDOS ── -->
            <section id="sec-tickets" class="view-section">
                <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
                    <span class="fw-bold me-2">Filtrar:</span>
                    <button class="filter-tab active" data-filtro="todos">Todos</button>
                    <button class="filter-tab" data-filtro="cajero"><i class="fa-solid fa-cash-register me-1"></i>Cajeros</button>
                    <button class="filter-tab" data-filtro="reponedor"><i class="fa-solid fa-boxes-stacked me-1"></i>Reponedores</button>
                    <button class="filter-tab" data-filtro="limpieza"><i class="fa-solid fa-broom me-1"></i>Limpieza</button>
                    <button class="filter-tab" data-filtro="pendiente">⏳ Pendientes</button>
                    <button class="filter-tab" data-filtro="resuelto">✅ Resueltos</button>
                </div>
                <div id="lista-tickets-supervisor">
                    <p class="text-muted">Cargando tickets...</p>
                </div>
            </section>

            <!-- ── CONSTRUCTOR DE HORARIOS ── -->
            <section id="sec-horarios" class="view-section" style="display:none;">
                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="card shadow-sm mb-3">
                            <div class="card-header"><i class="fa-solid fa-lock text-muted"></i> Horarios Fijos</div>
                            <div class="list-group list-group-flush" id="list-fijos"></div>
                        </div>
                        <div class="card shadow-sm border-success">
                            <div class="card-header bg-success text-white"><i class="fa-solid fa-arrows-up-down-left-right"></i> Flexibles — Arrastra</div>
                            <div class="list-group list-group-flush" id="list-flex"></div>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="card shadow-sm">
                            <div class="card-header">Calendario Semanal</div>
                            <div class="card-body table-responsive p-0">
                                <table class="table table-bordered text-center align-middle m-0" style="min-width:900px;">
                                    <thead class="table-light">
                                        <tr><th style="width:8%;">Hora</th><th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th><th>Sábado</th><th>Domingo</th></tr>
                                    </thead>
                                    <tbody id="calendario-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ── AGREGAR HORARIO FIJO ── -->
            <section id="sec-agregar" class="view-section" style="display:none;">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-header"><i class="fa-solid fa-calendar-plus text-success me-2"></i>Agregar Horario Fijo</div>
                            <div class="card-body">
                                <form id="formAddSchedule">
                                    <div class="mb-3"><label class="form-label">Empleado</label><select class="form-select" id="sch-empleado" required><option value="">Selecciona empleado</option></select></div>
                                    <div class="mb-3"><label class="form-label">Día</label><select class="form-select" id="sch-dia" required><option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option></select></div>
                                    <div class="mb-3"><label class="form-label">Hora inicio</label><select class="form-select" id="sch-hora" required><option>06:00</option><option>08:00</option><option>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option><option>20:00</option></select></div>
                                    <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-plus me-2"></i>Registrar Horario Fijo</button>
                                </form>
                                <div class="alert alert-success mt-3 d-none" id="sch-success"><i class="fa-solid fa-check-circle me-2"></i>Horario registrado.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast-msg" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex"><div class="toast-body fw-semibold"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/Auth.js"></script>
<script src="../js/Store.js"></script>
<script src="../js/supervisor.js"></script>
</body>
</html>
