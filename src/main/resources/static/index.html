<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeForge - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style_login.css">
</head>

<body>
<div class="login-wrapper">

    <div class="brand-header">
        <div class="brand-icon"><i class="fa-solid fa-clock"></i></div>
        <h1>TimeForge</h1>
        <p>Sistema de Gestión de Turnos — Retail</p>
    </div>

    <div class="login-card">
        <p class="role-label text-center">Selecciona tu rol</p>

        <!-- Fila 1: roles operativos -->
        <div class="role-selector mb-2" id="roleSelector">
            <div class="role-btn active" data-role="supervisor">
                <i class="fa-solid fa-user-tie"></i> Supervisor
            </div>
            <div class="role-btn" data-role="cajero">
                <i class="fa-solid fa-cash-register"></i> Cajero
            </div>
            <div class="role-btn" data-role="reponedor">
                <i class="fa-solid fa-boxes-stacked"></i> Reponedor
            </div>
        </div>
        <!-- Fila 2: limpieza + admin -->
        <div class="role-selector mb-3">
            <div class="role-btn" data-role="limpieza">
                <i class="fa-solid fa-broom"></i> Limpieza
            </div>
            <div class="role-btn" data-role="admin">
                <i class="fa-solid fa-shield-halved"></i> Admin
            </div>
        </div>

        <div class="alert alert-login mb-3" id="loginAlert" style="display:none;">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span id="alertMsg"></span>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Tu nombre de usuario" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                    <button type="button" class="btn-password-toggle" id="togglePassword">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Recordarme</label>
                </div>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText"><i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar Sesión</span>
                <span id="btnSpinner" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2"></span>Verificando...
                </span>
            </button>
        </form>

        <!-- Credenciales demo -->
        <div class="demo-hint mt-3">
            <span class="demo-title">Demo:</span>
            supervisor/1234 &bull; cajero/1234 &bull; reponedor/1234 &bull; limpieza/1234 &bull; admin/admin
        </div>
    </div>

    <div class="login-footer">
        &copy; <span id="year"></span> TimeForge — Facultad de Ingeniería, Utp — Lima, Perú
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/Auth.js"></script>
<script src="js/Store.js"></script>
<script src="js/login.js"></script>
</body>
</html>
