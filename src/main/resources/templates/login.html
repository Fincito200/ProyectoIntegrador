<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TimeForge — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body{background:linear-gradient(135deg,#1e1b4b,#312e81,#4338ca);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;}
    .wrap{width:100%;max-width:440px;padding:1rem;}
    .brand{text-align:center;color:#fff;margin-bottom:2rem;}
    .brand-icon{width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;margin:0 auto 1rem;}
    .brand h1{font-size:2rem;font-weight:800;margin:0;}
    .brand p{opacity:.7;margin:0;font-size:.9rem;}
    .card{border-radius:20px;padding:2rem;box-shadow:0 25px 50px rgba(0,0,0,.3);}
    .role-label{font-size:.8rem;color:#6c757d;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
    .role-selector{display:flex;gap:.5rem;flex-wrap:wrap;}
    .role-btn{flex:1;min-width:80px;padding:.5rem .4rem;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:.78rem;font-weight:600;color:#64748b;cursor:pointer;transition:all .2s;user-select:none;}
    .role-btn:hover,.role-btn.active{border-color:#4f46e5;background:#ede9fe;color:#4f46e5;}
    .role-btn i{display:block;font-size:1.2rem;margin-bottom:.25rem;}
    .btn-login{width:100%;padding:.75rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;}
    .btn-login:hover{opacity:.9;}
    .demo-hint{background:#f8fafc;border-radius:8px;padding:.6rem .8rem;font-size:.75rem;color:#64748b;border:1px solid #e2e8f0;}
    .footer{text-align:center;color:rgba(255,255,255,.5);font-size:.8rem;margin-top:1.5rem;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-clock"></i></div>
    <h1>TimeForge</h1>
    <p>Sistema de Gestión de Turnos — Retail</p>
  </div>
  <div class="card">
    <div th:if="${error}"  class="alert alert-danger  py-2 mb-3"><i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span></div>
    <div th:if="${logout}" class="alert alert-success py-2 mb-3"><i class="fa-solid fa-circle-check me-2"></i><span th:text="${logout}"></span></div>
    <p class="role-label text-center mb-2">Selecciona tu rol</p>
    <div class="role-selector mb-2">
      <div class="role-btn active" data-user="supervisor" data-pass="1234"><i class="fa-solid fa-user-tie"></i>Supervisor</div>
      <div class="role-btn"        data-user="cajero"     data-pass="1234"><i class="fa-solid fa-cash-register"></i>Cajero</div>
      <div class="role-btn"        data-user="reponedor"  data-pass="1234"><i class="fa-solid fa-boxes-stacked"></i>Reponedor</div>
    </div>
    <div class="role-selector mb-3">
      <div class="role-btn" data-user="limpieza" data-pass="1234"><i class="fa-solid fa-broom"></i>Limpieza</div>
      <div class="role-btn" data-user="admin"    data-pass="admin"><i class="fa-solid fa-shield-halved"></i>Admin</div>
    </div>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" id="username" name="username" required placeholder="usuario"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required placeholder="contraseña"/>
          <button type="button" class="btn btn-outline-secondary" id="togglePwd"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar Sesión</button>
    </form>
    <div class="demo-hint"><strong style="color:#4f46e5">Demo:</strong> supervisor/1234 &bull; cajero/1234 &bull; reponedor/1234 &bull; limpieza/1234 &bull; admin/admin</div>
  </div>
  <div class="footer">&copy; <span id="yr"></span> TimeForge — Facultad de Ingeniería, UTP — Lima, Perú</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('username').value = b.dataset.user;
    document.getElementById('password').value = b.dataset.pass;
  }));
  document.getElementById('username').value = 'supervisor';
  document.getElementById('password').value = '1234';
  document.getElementById('togglePwd').addEventListener('click', () => {
    const i = document.getElementById('password'), e = document.getElementById('eyeIcon');
    const h = i.type === 'password'; i.type = h ? 'text' : 'password';
    e.className = h ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  });
</script>
</body>
</html>
