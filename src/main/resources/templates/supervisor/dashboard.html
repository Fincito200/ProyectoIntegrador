<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TimeForge — Supervisor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body{font-family:'Segoe UI',sans-serif;}
    #sb{min-height:100vh;width:256px;min-width:256px;transition:margin .25s;background:#1e293b;}
    #wr.tog #sb{margin-left:-256px;}
    .view-section.dn{display:none!important;}
    .nl.active{background:#f59e0b!important;border-color:#f59e0b!important;color:#000!important;}
    .nl:not(.active):hover{background:rgba(255,255,255,.08)!important;color:#fff!important;}
    .tcard{background:#fff;border-radius:10px;padding:1rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .bp{background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;}
    .bpr{background:#dbeafe;color:#1e40af;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;}
    .br{background:#d1fae5;color:#065f46;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;}
    .rb{font-size:.7rem;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:99px;}
    .af{position:fixed;top:1rem;right:1rem;z-index:9999;min-width:280px;}
    table th,table td{vertical-align:middle;}
  </style>
</head>
<body class="bg-light">
<div th:if="${success}" class="alert alert-success alert-dismissible af shadow"><i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
<div th:if="${error}"   class="alert alert-danger  alert-dismissible af shadow"><i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

<div class="d-flex" id="wr">
  <aside id="sb" class="text-white">
    <div class="text-center py-4 fw-bold border-bottom border-secondary px-3"><i class="fa-solid fa-clock"></i> TimeForge<div class="rb mt-1">Supervisor</div></div>
    <div class="list-group list-group-flush my-3">
      <a href="#" class="list-group-item list-group-item-action bg-transparent text-white active nl" data-t="s1" data-ti="Gestión de Tickets"><i class="fa-solid fa-ticket me-2"></i>Tickets</a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent text-white nl"        data-t="s2" data-ti="Gestión de Horarios"><i class="fa-solid fa-calendar-days me-2"></i>Horarios</a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent text-white nl"        data-t="s3" data-ti="Empleados"><i class="fa-solid fa-users me-2"></i>Empleados</a>
    </div>
  </aside>

  <main class="bg-light w-100">
    <nav class="navbar bg-white border-bottom px-4 py-3 d-flex align-items-center">
      <button class="btn btn-outline-secondary me-3" id="mt"><i class="fa-solid fa-bars"></i></button>
      <h2 class="fs-5 m-0" id="vt">Gestión de Tickets</h2>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="text-end d-none d-md-block"><div class="fw-semibold small" sec:authentication="name">supervisor</div><div class="text-muted small">Supervisor</div></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#f59e0b;display:flex;align-items:center;justify-content:center;color:#000;"><i class="fa-solid fa-user-tie"></i></div>
        <form th:action="@{/logout}" method="post" class="d-inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>Salir</button>
        </form>
      </div>
    </nav>
    <div class="container-fluid p-4">

      <!-- TICKETS -->
      <section id="s1" class="view-section">
        <div class="d-flex gap-2 flex-wrap mb-3">
          <a th:href="@{/supervisor(filtro='todos')}"     class="btn btn-sm btn-outline-secondary" th:classappend="${filtro=='todos'}     ? ' active' : ''">Todos</a>
          <a th:href="@{/supervisor(filtro='cajero')}"    class="btn btn-sm btn-outline-primary"   th:classappend="${filtro=='cajero'}    ? ' active' : ''"><i class="fa-solid fa-cash-register me-1"></i>Cajero</a>
          <a th:href="@{/supervisor(filtro='reponedor')}" class="btn btn-sm btn-outline-success"   th:classappend="${filtro=='reponedor'}  ? ' active' : ''"><i class="fa-solid fa-boxes-stacked me-1"></i>Reponedor</a>
          <a th:href="@{/supervisor(filtro='limpieza')}"  class="btn btn-sm btn-outline-secondary" th:classappend="${filtro=='limpieza'} ? ' active' : ''" style="border-color:#7c3aed;color:#7c3aed"><i class="fa-solid fa-broom me-1"></i>Limpieza</a>
          <a th:href="@{/supervisor(filtro='pendiente')}" class="btn btn-sm btn-outline-warning"   th:classappend="${filtro=='pendiente'} ? ' active' : ''">Pendientes</a>
          <a th:href="@{/supervisor(filtro='proceso')}"   class="btn btn-sm btn-outline-info"      th:classappend="${filtro=='proceso'}   ? ' active' : ''">En proceso</a>
          <a th:href="@{/supervisor(filtro='resuelto')}"  class="btn btn-sm btn-outline-success"   th:classappend="${filtro=='resuelto'}  ? ' active' : ''">Resueltos</a>
        </div>
        <div th:if="${#lists.isEmpty(tickets)}" class="text-center text-muted py-5"><i class="fa-solid fa-inbox fs-1 d-block mb-2"></i>No hay tickets en esta categoría.</div>
        <div th:each="t : ${tickets}" class="tcard"
             th:style="'border-left:4px solid ' + (${t.rol.name() == 'cajero'} ? '#4f46e5' : (${t.rol.name() == 'reponedor'} ? '#059669' : '#7c3aed'))">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div><strong th:text="${t.titulo}"></strong><div class="text-muted small mt-1" th:text="${t.descripcion}"></div></div>
            <span th:class="${t.estado.name() == 'pendiente'} ? 'bp' : (${t.estado.name() == 'proceso'} ? 'bpr' : 'br')" th:text="${t.estado.label}" class="ms-3"></span>
          </div>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="badge" th:style="'background:' + (${t.rol.name() == 'cajero'} ? '#4f46e5' : (${t.rol.name() == 'reponedor'} ? '#059669' : '#7c3aed'))" th:text="${t.rol.label}"></span>
            <span class="badge" th:classappend="${t.prioridad.name() == 'Alta'} ? 'bg-danger' : (${t.prioridad.name() == 'Media'} ? 'bg-warning text-dark' : 'bg-success')" th:text="${t.prioridad.name()}"></span>
            <span class="badge bg-light text-dark border" th:text="${t.categoria}"></span>
            <span class="text-muted small" th:text="'por ' + ${t.autor}"></span>
            <div class="ms-auto d-flex gap-1">
              <form th:if="${t.estado.name() != 'proceso'}"  th:action="@{/supervisor/tickets/estado/{id}(id=${t.id})}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" name="estado" value="proceso"/>
                <button class="btn btn-sm btn-outline-info">En proceso</button>
              </form>
              <form th:if="${t.estado.name() != 'resuelto'}" th:action="@{/supervisor/tickets/estado/{id}(id=${t.id})}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" name="estado" value="resuelto"/>
                <button class="btn btn-sm btn-outline-success">Resuelto</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- HORARIOS -->
      <section id="s2" class="view-section dn">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold"><i class="fa-solid fa-calendar-days me-2 text-warning"></i>Horarios Registrados</div>
              <div class="card-body p-0">
                <table class="table table-hover mb-0">
                  <thead class="table-light"><tr><th>Empleado</th><th>Día</th><th>Hora</th><th>Tipo</th><th></th></tr></thead>
                  <tbody>
                    <tr th:each="h : ${horarios}">
                      <td th:text="${h.empleado.nombre}"></td><td th:text="${h.dia}"></td><td th:text="${h.hora}"></td>
                      <td><span class="badge bg-secondary" th:text="${h.tipo.name()}"></span></td>
                      <td>
                        <form th:action="@{/supervisor/horarios/eliminar/{id}(id=${h.id})}" method="post">
                          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                          <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                        </form>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(horarios)}"><td colspan="5" class="text-center text-muted py-4">Sin horarios.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-semibold"><i class="fa-solid fa-plus me-2 text-warning"></i>Agregar Horario</div>
              <div class="card-body">
                <form th:action="@{/supervisor/horarios/agregar}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <div class="mb-3"><label class="form-label small fw-semibold">Empleado</label>
                    <select name="empleadoId" class="form-select" required>
                      <option value="">Selecciona...</option>
                      <option th:each="emp : ${empleados}" th:value="${emp.id}" th:text="${emp.nombre + ' (' + emp.rol.label + ')'}"></option>
                    </select></div>
                  <div class="mb-3"><label class="form-label small fw-semibold">Día</label>
                    <select name="dia" class="form-select"><option th:each="d : ${dias}" th:value="${d}" th:text="${d}"></option></select></div>
                  <div class="mb-3"><label class="form-label small fw-semibold">Hora</label>
                    <select name="hora" class="form-select"><option th:each="h : ${horas}" th:value="${h}" th:text="${h}"></option></select></div>
                  <button type="submit" class="btn btn-warning w-100 text-dark fw-semibold"><i class="fa-solid fa-plus me-1"></i>Registrar</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- EMPLEADOS -->
      <section id="s3" class="view-section dn">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold"><i class="fa-solid fa-users me-2 text-primary"></i>Empleados</div>
          <div class="card-body p-0">
            <table class="table table-hover mb-0">
              <thead class="table-light"><tr><th>Nombre</th><th>Rol</th><th>Tipo</th><th>Horas</th></tr></thead>
              <tbody>
                <tr th:each="emp : ${empleados}">
                  <td th:text="${emp.nombre}"></td>
                  <td><span class="badge" th:classappend="'bg-' + ${emp.rol.badgeColor}" th:text="${emp.rol.label}"></span></td>
                  <td><span class="badge" th:classappend="${emp.tipo.name() == 'fijo'} ? 'bg-secondary' : 'bg-success'" th:text="${emp.tipo.label}"></span></td>
                  <td th:text="${emp.horas} + 'h'"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  setTimeout(()=>document.querySelectorAll('.af').forEach(a=>{try{bootstrap.Alert.getOrCreateInstance(a).close();}catch(e){}}),4000);
  document.getElementById('mt').addEventListener('click',()=>document.getElementById('wr').classList.toggle('tog'));
  document.querySelectorAll('.nl').forEach(l=>{
    l.addEventListener('click',e=>{
      e.preventDefault();
      document.querySelectorAll('.nl').forEach(x=>x.classList.remove('active'));l.classList.add('active');
      document.querySelectorAll('.view-section').forEach(s=>s.classList.add('dn'));
      const s=document.getElementById(l.dataset.t);if(s)s.classList.remove('dn');
      const t=document.getElementById('vt');if(t&&l.dataset.ti)t.textContent=l.dataset.ti;
    });
  });
</script>
</body>
</html>
